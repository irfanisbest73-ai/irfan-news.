<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRFAN NEWS</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  color: #172033;
}

header {
  background: #101d3a;
  color: white;
  text-align: center;
  padding: 28px 15px;
}

header h1 {
  margin: 0;
  font-size: 36px;
  letter-spacing: 2px;
}

header p {
  color: #cbd5e1;
  margin-bottom: 0;
}

.breaking {
  background: #e11d48;
  color: white;
  padding: 12px;
  text-align: center;
  font-weight: bold;
}

.container {
  max-width: 1150px;
  margin: auto;
  padding: 20px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}

input {
  flex: 1;
  min-width: 200px;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 8px;
  background: #1d4ed8;
  color: white;
  padding: 12px 16px;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  background: #163da8;
}

.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}

.categories button {
  background: #dbeafe;
  color: #1e40af;
}

.categories button.active {
  background: #1d4ed8;
  color: white;
}

.status {
  margin: 15px 0;
  color: #475569;
  line-height: 1.5;
}

.news-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 18px;
}

.news-card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  border-top: 4px solid #1d4ed8;
  box-shadow: 0 3px 12px #0000000d;
}

.news-card h3 {
  line-height: 1.5;
  margin-top: 0;
}

.news-card p {
  color: #64748b;
  font-size: 13px;
  line-height: 1.5;
}

.news-card a {
  display: inline-block;
  margin-top: 10px;
  color: #1d4ed8;
  font-weight: bold;
  text-decoration: none;
}

.news-card a:hover {
  text-decoration: underline;
}

footer {
  background: #101d3a;
  color: white;
  text-align: center;
  padding: 22px;
  margin-top: 35px;
}

footer a {
  color: #93c5fd;
}

</style>
</head>

<body>

<header>
  <h1>IRFAN NEWS</h1>
  <p>Your Daily News Destination</p>
</header>

<div class="breaking">
  🔴 LATEST HEADLINES FROM NDTV
</div>

<main class="container">

  <div class="controls">
    <input
      type="text"
      id="search"
      placeholder="Search news headlines..."
      oninput="displayNews()"
    >

    <button onclick="loadNews()">
      🔄 Refresh News
    </button>
  </div>

  <div class="categories">
    <button class="active"
      onclick="changeCategory('top', this)">
      Top Stories
    </button>

    <button onclick="changeCategory('latest', this)">
      Latest
    </button>

    <button onclick="changeCategory('india', this)">
      India
    </button>
  </div>

  <h2>Latest News</h2>

  <div class="status" id="status">
    Connecting to NDTV...
  </div>

  <div class="news-grid" id="news"></div>

</main>

<footer>
  <p>© 2026 IRFAN NEWS</p>
  <p>News headlines provided by NDTV.com</p>
  <p>
    <a href="https://www.ndtv.com/"
       target="_blank"
       rel="noopener noreferrer">
       Visit NDTV Official Website
    </a>
  </p>
</footer>

<script>

let currentCategory = "top";
let allNews = [];

async function loadNews() {
  const status = document.getElementById("status");
  const newsBox = document.getElementById("news");

  status.textContent = "Loading NDTV headlines...";
  newsBox.innerHTML = "";

  try {
    const response = await fetch(
      `/api/news?category=${currentCategory}`
    );

    if (!response.ok) {
      throw new Error("Unable to contact news server");
    }

    const data = await response.json();
    allNews = data.items || [];

    if (allNews.length === 0) {
      status.textContent = "No headlines found.";
      return;
    }

    displayNews();

    status.textContent =
      allNews.length + " NDTV headlines loaded. Last checked: " +
      new Date().toLocaleTimeString();

  } catch (error) {
    status.textContent = "Unable to load news: " + error.message;
  }
}

function displayNews() {
  const newsBox = document.getElementById("news");
  const searchText =
    document.getElementById("search").value.toLowerCase();

  newsBox.innerHTML = "";

  const filtered = allNews.filter(item =>
    (item.title || "").toLowerCase().includes(searchText)
  );

  if (filtered.length === 0) {
    newsBox.textContent = "No matching headlines found.";
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement("article");
    card.className = "news-card";

    const title = document.createElement("h3");
    title.textContent = item.title;

    const source = document.createElement("p");
    source.textContent = "Source: NDTV.com";

    const date = document.createElement("p");
    const parsedDate = new Date(item.date);
    date.textContent = "Published: " +
      (isNaN(parsedDate.getTime())
        ? (item.date || "Date unavailable")
        : parsedDate.toLocaleString());

    const link = document.createElement("a");
    link.textContent = "Read Full News →";
    link.href = item.link || "https://www.ndtv.com/";
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    card.append(title, source, date, link);
    newsBox.appendChild(card);
  });
}

function changeCategory(category, button) {
  currentCategory = category;

  document.querySelectorAll(".categories button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");
  loadNews();
}

loadNews();
setInterval(loadNews, 5 * 60 * 1000);
</script>

</body>
</html>
